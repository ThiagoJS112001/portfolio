<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#f8f9fa"/>
  
  <!-- Central support desk/computer -->
  <g transform="translate(200, 125)">
    <!-- Computer monitor -->
    <rect x="-40" y="-30" width="80" height="50" fill="#2c3e50" rx="4"/>
    <rect x="-35" y="-25" width="70" height="35" fill="#34495e"/>
    <rect x="-30" y="-20" width="60" height="25" fill="#3498db"/>
    
    <!-- Screen content (code/terminal) -->
    <g fill="#2ecc71" font-family="monospace" font-size="4">
      <text x="-25" y="-15">&gt; system check</text>
      <text x="-25" y="-10">&gt; status: OK</text>
      <text x="-25" y="-5">&gt; resolving...</text>
    </g>
    
    <!-- Monitor stand -->
    <rect x="-8" y="20" width="16" height="3" fill="#2c3e50"/>
    <rect x="-15" y="23" width="30" height="4" fill="#2c3e50" rx="2"/>
    
    <!-- Support agent (simplified) -->
    <g transform="translate(0, -60)">
      <!-- Head -->
      <circle cx="0" cy="0" r="8" fill="#f39c12"/>
      <!-- Headset -->
      <path d="M-8,-2 C-8,-6 -4,-8 0,-8 C4,-8 8,-6 8,-2" stroke="#e74c3c" stroke-width="2" fill="none"/>
      <circle cx="-8" cy="-2" r="2" fill="#e74c3c"/>
      <circle cx="8" cy="-2" r="2" fill="#e74c3c"/>
      <!-- Microphone -->
      <path d="M8,-2 Q12,2 8,6" stroke="#e74c3c" stroke-width="2" fill="none"/>
      <circle cx="8" cy="6" r="1.5" fill="#e74c3c"/>
    </g>
  </g>
  
  <!-- Support tools around -->
  <g transform="translate(120, 80)">
    <!-- Wrench -->
    <path d="M-8,-8 L-4,-4 L4,-12 L8,-8 L4,-4 L12,4 L8,8 L-8,-8 Z" fill="#95a5a6"/>
  </g>
  
  <g transform="translate(280, 80)">
    <!-- Gear -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#95a5a6" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#95a5a6"/>
    <g stroke="#95a5a6" stroke-width="2">
      <line x1="0" y1="-12" x2="0" y2="-10"/>
      <line x1="8.5" y1="-8.5" x2="7" y2="-7"/>
      <line x1="8.5" y1="8.5" x2="7" y2="7"/>
      <line x1="0" y1="12" x2="0" y2="10"/>
      <line x1="-8.5" y1="8.5" x2="-7" y2="7"/>
      <line x1="-8.5" y1="-8.5" x2="-7" y2="-7"/>
    </g>
  </g>
  
  <!-- Support tickets/notifications -->
  <g transform="translate(80, 160)">
    <!-- Ticket 1 -->
    <rect x="0" y="0" width="25" height="15" fill="#e74c3c" rx="2"/>
    <text x="12.5" y="10" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">!</text>
    
    <!-- Ticket 2 -->
    <rect x="30" y="0" width="25" height="15" fill="#f39c12" rx="2"/>
    <text x="42.5" y="10" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">?</text>
    
    <!-- Ticket 3 -->
    <rect x="60" y="0" width="25" height="15" fill="#2ecc71" rx="2"/>
    <text x="72.5" y="10" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">✓</text>
  </g>
  
  <!-- Communication icons -->
  <g transform="translate(320, 160)">
    <!-- Chat bubble -->
    <path d="M0,0 L20,0 Q25,0 25,5 L25,10 Q25,15 20,15 L5,15 L0,20 L0,15 Q0,10 0,5 Q0,0 0,0 Z" fill="#3498db"/>
    <circle cx="7" cy="7.5" r="1.5" fill="#fff"/>
    <circle cx="12.5" cy="7.5" r="1.5" fill="#fff"/>
    <circle cx="18" cy="7.5" r="1.5" fill="#fff"/>
  </g>
  
  <!-- Performance/Analytics chart -->
  <g transform="translate(60, 120)">
    <rect x="0" y="10" width="4" height="10" fill="#3498db"/>
    <rect x="6" y="5" width="4" height="15" fill="#2ecc71"/>
    <rect x="12" y="8" width="4" height="12" fill="#f39c12"/>
    <rect x="18" y="3" width="4" height="17" fill="#e74c3c"/>
    <!-- Trend line -->
    <path d="M2,18 L8,12 L14,15 L20,8" stroke="#9b59b6" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Clock (24/7 support) -->
  <g transform="translate(340, 100)">
    <circle cx="0" cy="0" r="12" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#fff">24/7</text>
  </g>
  
  <!-- Bottom title -->
  <text x="200" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2c3e50">SUPORTE TÉCNICO COMPLETO</text>
</svg>
